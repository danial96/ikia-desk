name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            export GIT_DIR=/home/digitalservicesc/public_html/Ikiatech/.git
            export GIT_WORK_TREE=/home/digitalservicesc/public_html/Ikiatech
            git config --global --add safe.directory /home/digitalservicesc/public_html/Ikiatech
            cd /home/digitalservicesc/public_html/Ikiatech
            git fetch origin main
            git reset --hard origin/main
            /usr/local/bin/php artisan migrate --force
            /usr/local/bin/php artisan config:cache
            /usr/local/bin/php artisan route:cache
            /usr/local/bin/php artisan view:cache
            /usr/local/bin/php artisan cache:clear
            echo "Deploy complete"

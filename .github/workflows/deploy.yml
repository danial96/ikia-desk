name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_sqlite
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests
        run: php artisan test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Netcup (desk.ikiatech.com)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.NETCUP_SSH_HOST }}
          username: ${{ secrets.NETCUP_SSH_USERNAME }}
          key: ${{ secrets.NETCUP_SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -e
            cd /desk.ikiatech.com/ikia-desk

            # Maintenance mode during the update; always bring the site back up, even on failure
            php artisan down --retry=15 || true
            trap 'php artisan up' EXIT

            git fetch origin main
            git reset --hard origin/main

            if command -v composer >/dev/null 2>&1; then
              composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader
            fi

            php artisan migrate --force
            php artisan view:clear
            php artisan cache:clear
            echo "Deploy complete"
